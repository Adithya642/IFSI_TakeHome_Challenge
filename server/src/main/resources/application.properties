spring.application.name=exam-requests

# SQLite file, relative to server/ (start the server from that folder).
# foreign_keys=true: SQLite leaves FK checks off unless asked.
spring.datasource.url=jdbc:sqlite:../db/ifsi.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows one writer at a time, so use a single shared connection.
spring.datasource.hikari.maximum-pool-size=1

# Run schema.sql (courses table) on every start; it is safe to repeat.
# Spring only does this automatically for in-memory databases.
spring.sql.init.mode=always

# JSON keys match sample_requests.json (student_id, not studentId).
spring.jackson.property-naming-strategy=SNAKE_CASE
